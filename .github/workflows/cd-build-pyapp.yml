name: PyApp Build

on:
  push:
    tags:
      - "vsview/v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  VSVIEW_PYTHON_VERSION: "3.14"
  UV_NO_SYNC: true

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Build PyApp binary
        id: build
        uses: ./.github/actions/build-pyapp
        with:
          rust-target: x86_64-pc-windows-msvc
          windows-icon-path: ${{ github.workspace }}/src/pyapp/icons/windows/vsview.ico

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsview-pyapp-windows-x86_64
          path: dist/VSView.exe
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            target_id: linux-x86_64
            rust-target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            container: quay.io/pypa/manylinux_2_39_aarch64
            target_id: linux-aarch64
            rust-target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Build PyApp binary
        id: build
        uses: ./.github/actions/build-pyapp
        with:
          rust-target: ${{ matrix.rust-target }}
          windows-icon-path: ${{ github.workspace }}/src/pyapp/icons/windows/vsview.ico

      - name: Package Linux distribution
        run: |
          mkdir -p dist/package/icons
          cp dist/VSView dist/package/
          cp src/pyapp/install.sh dist/package/
          cp -r src/pyapp/icons/linux/* dist/package/icons/
          chmod +x dist/package/install.sh dist/package/VSView

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsview-pyapp-${{ matrix.target_id }}
          path: dist/package/
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-26
            target_id: macos-arm64
            rust-target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-26-intel
            target_id: macos-x86_64
            rust-target: x86_64-apple-darwin

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Build PyApp binary
        id: build
        uses: ./.github/actions/build-pyapp
        with:
          rust-target: ${{ matrix.rust-target }}
          windows-icon-path: ${{ github.workspace }}/src/pyapp/icons/windows/vsview.ico

      - name: Create macOS app bundle and DMG
        run: |
          uv run vsapp bundle dist/VSView ${{ steps.build.outputs.version }} \
            --env src/pyapp/.env.example \
            --iconset-dir src/pyapp/icons/macos/vsview.iconset

          mkdir dmg_staging
          ditto dist/AppBundle dmg_staging/VSView.app
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname VSView -srcfolder dmg_staging -ov -format UDZO dist/VSView.dmg

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsview-pyapp-${{ matrix.target_id }}
          path: dist/VSView.dmg
          if-no-files-found: error
