name: Build PyApp
description: Check out the project, set up build tools, and build the PyApp binary.

inputs:
  rust-target:
    description: Rust compilation target for the PyApp binary.
    required: true
  windows-icon-path:
    description: Windows icon path passed to PyApp.
    required: false

outputs:
  version:
    description: The version derived from the release tag or manual-build fallback.
    value: ${{ steps.project.outputs.version }}
  wheel-path:
    description: The absolute path to the wheel built for a manual workflow run.
    value: ${{ steps.project.outputs.wheel-path }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Checkout PyApp submodule
      shell: bash
      run: |
        # Workaround for Linux containers
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule update --init --recursive submodules/pyapp

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ env.VSVIEW_PYTHON_VERSION }}

    - name: Sync environment
      shell: bash
      run: uv sync --package vsview-pyapp

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        target: ${{ inputs.rust-target }}

    - name: Resolve project source
      id: project
      shell: bash
      run: uv run python .github/scripts/resolve_pyapp_project_source.py

    - name: Build PyApp binary
      shell: bash
      env:
        PYAPP_PROJECT_VERSION: ${{ steps.project.outputs.version }}
        PYAPP_PROJECT_PATH: ${{ steps.project.outputs.wheel-path }}
        PYAPP_WINDOWS_ICON_PATH: ${{ inputs.windows-icon-path }}
      run: uv run vsapp build --env src/pyapp/.env.example
